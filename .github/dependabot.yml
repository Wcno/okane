version: 2
updates:
  - package-ecosystem: npm
    directory: /webapp/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Keep runtime type definitions aligned with the supported Node 24 major.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /api-service
      - /webapp/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Stay on the Django 5.2 LTS line until the team chooses to move.
    ignore:
      - dependency-name: Django
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /api-service
      - /webapp
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
