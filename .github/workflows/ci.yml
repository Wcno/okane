name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: el pipeline solo lee el repositorio.
permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecución anterior; en main cada commit se verifica completo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: webapp/frontend/.nvmrc
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Instalar dependencias exactas del lockfile
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build de producción
        run: npm run build

      # Entrega continua: cada commit en main deja su build listo para desplegar.
      - name: Publicar el build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: webapp/frontend/dist
          retention-days: 14
          if-no-files-found: error

  convenciones:
    name: convenciones
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # El título y los mensajes llegan por variables de entorno, nunca interpolados
      # en el script, para que un título malicioso no pueda ejecutar comandos.
      - name: Título del PR y mensajes de commit siguen Conventional Commits
        env:
          TITULO: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          patron='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          fallos=0

          if ! printf '%s\n' "$TITULO" | grep -Eq "$patron"; then
            echo "::error::El título del PR no sigue Conventional Commits: $TITULO"
            fallos=1
          fi

          while IFS= read -r asunto; do
            case "$asunto" in Merge\ *) continue ;; esac
            if ! printf '%s\n' "$asunto" | grep -Eq "$patron"; then
              echo "::error::Commit que no sigue Conventional Commits: $asunto"
              fallos=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")

          if [ "$fallos" -ne 0 ]; then
            echo "Formato esperado: tipo(ámbito opcional): descripción. Ejemplo: feat(api): registrar ingresos"
            exit 1
          fi
          echo "Título y commits en formato correcto."
