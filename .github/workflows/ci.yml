name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: el pipeline solo lee el repositorio.
permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecución anterior; en main cada commit se verifica completo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: webapp/frontend/.nvmrc
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Instalar dependencias exactas del lockfile
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build de producción
        run: npm run build

      # Entrega continua: el build de main se empaqueta para la demo publica.
      - name: Build de la demo con su ruta base
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run build -- --base=/okane/
          cp dist/index.html dist/404.html

      - name: Empaquetar la demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webapp/frontend/dist

  # Despliegue continuo: solo desde main, solo si la CI paso, y solo cuando el
  # equipo activa GitHub Pages y define la variable PAGES_ENABLED=true.
  desplegar:
    name: desplegar demo
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  convenciones:
    name: convenciones
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # El título y los mensajes llegan por variables de entorno, nunca interpolados
      # en el script, para que un título malicioso no pueda ejecutar comandos.
      - name: Título del PR y mensajes de commit siguen Conventional Commits
        env:
          TITULO: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          patron='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          fallos=0

          if ! printf '%s\n' "$TITULO" | grep -Eq "$patron"; then
            echo "::error::El título del PR no sigue Conventional Commits: $TITULO"
            fallos=1
          fi

          while IFS= read -r asunto; do
            case "$asunto" in Merge\ *) continue ;; esac
            if ! printf '%s\n' "$asunto" | grep -Eq "$patron"; then
              echo "::error::Commit que no sigue Conventional Commits: $asunto"
              fallos=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")

          if [ "$fallos" -ne 0 ]; then
            echo "Formato esperado: tipo(ámbito opcional): descripción. Ejemplo: feat(api): registrar ingresos"
            exit 1
          fi
          echo "Título y commits en formato correcto."
