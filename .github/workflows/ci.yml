# Validate the frontend, both Django services and the four-container stack on
# pull requests and main pushes. Pages deployment remains opt-in through
# PAGES_ENABLED.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: webapp/frontend/.nvmrc
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Build the demo with its base path
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run build -- --base=/okane/
          cp dist/index.html dist/404.html

      - name: Package the demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webapp/frontend/dist

  backend:
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-service, directory: api-service }
          - { name: webapp, directory: webapp/backend }
    defaults:
      run:
        working-directory: ${{ matrix.service.directory }}
    # Tests use PostgreSQL, the same engine as the running system.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: okane
          POSTGRES_USER: okane
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okane -d okane"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      INTERNAL_SERVICE_KEY: ci-only-service-key
      DATABASE_HOST: localhost
      DATABASE_NAME: okane
      DATABASE_USER: okane
      DATABASE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: ${{ matrix.service.directory }}/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure the stack from the documented example
        run: cp .env.example .env

      - name: Build and start the four containers
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Check the running system
        run: bash scripts/smoke-test.sh

      - name: Show container state and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  deploy-demo:
    name: deploy demo
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Conventional Commit title and messages
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          failures=0

          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title does not follow Conventional Commits: $TITLE"
            failures=1
          fi

          while IFS= read -r subject; do
            case "$subject" in Merge\ *) continue ;; esac
            if ! printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Commit does not follow Conventional Commits: $subject"
              failures=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")

          if [ "$failures" -ne 0 ]; then
            echo "Expected: type(optional-scope): description. Example: feat(api): record income"
            exit 1
          fi
          echo "PR title and commits use the expected format."
